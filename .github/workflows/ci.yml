name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit Tests With Coverage
        run: pnpm run test:cov --runInBand --testPathIgnorePatterns='/integration/|/e2e/'

      - name: Build
        run: pnpm run build

      # TIMEOUT: audit --prod takes too long
      # - name: Security Audit (prod deps)
      #  run: pnpm audit --prod
